name: Black Friday deals

on:
  schedule:
    - cron: "17 * * * *"   # refresh deals every hour
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["black-friday-deals/**", ".github/workflows/black-friday-deals.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    defaults:
      run:
        working-directory: black-friday-deals
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - id: pages
        uses: actions/configure-pages@v5
      - name: Fetch latest deals (adds to the deals already published)
        run: npm run fetch
        env:
          PREVIOUS_DEALS_URL: ${{ steps.pages.outputs.base_url }}/deals.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: black-friday-deals/public
      - id: deploy
        uses: actions/deploy-pages@v4
